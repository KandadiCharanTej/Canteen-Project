<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CanteenFood</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Ionicons for Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
    <div id="app" class="app-container">
        <!-- Header -->
        <header class="top-header" id="mainHeader">
            <div class="header-top">
                <h1 class="logo">CanteenFood</h1>
                <div class="profile-icon" onclick="appState.navigateTo('profile')">
                    <ion-icon name="person-circle-outline"></ion-icon>
                </div>
            </div>
            <div class="search-bar-container">
                <ion-icon name="search-outline"></ion-icon>
                <input type="text" id="searchInput" placeholder="Search for dishes..." oninput="appFunctions.filterMenu()">
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content" id="mainContent">
            <!-- Dynamic Content Injected Here -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active" id="nav-menu" onclick="appState.navigateTo('menu')">
                <ion-icon name="restaurant-outline"></ion-icon>
                <span>Menu</span>
            </div>
            <div class="nav-item" id="nav-cart" onclick="appState.navigateTo('cart')">
                <div class="cart-icon-wrapper">
                    <ion-icon name="cart-outline"></ion-icon>
                    <span class="cart-badge" id="cartBadge" style="display: none;">0</span>
                </div>
                <span>Cart</span>
            </div>
            <div class="nav-item" id="nav-orders" onclick="appState.navigateTo('orders')">
                <ion-icon name="receipt-outline"></ion-icon>
                <span>Orders</span>
            </div>
            <div class="nav-item" id="nav-admin" onclick="appState.navigateTo('admin')" style="display: none;">
                <ion-icon name="settings-outline"></ion-icon>
                <span>Admin</span>
            </div>
        </nav>
    </div>

    <!-- Auth Modal Overlay -->
    <div id="authModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Login to Continue</h2>
                <button class="close-btn" onclick="appFunctions.closeAuthModal()">
                    <ion-icon name="close-outline"></ion-icon>
                </button>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin" onclick="appFunctions.switchAuthTab('login')">Login</button>
                <button class="auth-tab" id="tabSignup" onclick="appFunctions.switchAuthTab('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active" onsubmit="appFunctions.handleLogin(event)">
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="loginPhone" required placeholder="Enter your phone number">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                <button type="submit" class="primary-btn">Login</button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form" onsubmit="appFunctions.handleSignup(event)">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" required placeholder="Enter your name">
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="signupPhone" required placeholder="Enter your phone number">
                </div>
                <div class="input-group">
                    <label>Role</label>
                    <select id="signupRole" required>
                        <option value="student">Student</option>
                        <option value="professor">Professor</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" required placeholder="Create a password">
                </div>
                <button type="submit" class="primary-btn">Sign Up</button>
            </form>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="/js/app.js"></script>
</body>
</html>
